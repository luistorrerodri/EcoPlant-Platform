; PlatformIO Project Configuration File - variante macetero02 (DHT22)
;
; Mismo framework/board que platformio.ini (macetero01). Unica diferencia
; real: sustituye las librerias BMP280/BME280/BME680 por la del DHT, ya
; que esta placa no lleva ningun sensor I2C de presion. Usar este
; fichero (como platformio.ini) en el proyecto PlatformIO dedicado a
; macetero02 - no se puede compartir un unico proyecto con
; macetero_produccion_6.ino, cada uno define su propio setup()/loop().

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/DHT sensor library@^1.4.6
	milesburton/DallasTemperature@^4.0.5
	paulstoffregen/OneWire@^2.3.8
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.4
	tzapu/WiFiManager@^2.0.17
